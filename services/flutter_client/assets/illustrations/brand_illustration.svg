    <rect x="-65" y="-10" width="130" height="100" rx="16" fill="url(#grad2)" opacity="0.3"/>

    <path d="M -35 -10 L -35 -45 A 35 35 0 0 1 35 -45 L 35 -10" stroke="white" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>

    <circle cx="-25" cy="35" r="8" fill="white" opacity="0.9"/>
    <circle cx="0" cy="35" r="8" fill="white" opacity="0.9"/>
    <circle cx="25" cy="35" r="8" fill="white" opacity="0.9"/>

    <circle cx="-35" cy="-55" r="10" fill="#06B6D4" opacity="0.8"/>
    <circle cx="45" cy="-35" r="6" fill="#EC4899" opacity="0.7"/>
    <circle cx="-50" cy="10" r="5" fill="#10B981" opacity="0.6"/>
  </g>
</svg>
